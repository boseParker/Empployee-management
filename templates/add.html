<!DOCTYPE html>
<html>
<head>
  <title>Add Employee</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

  <div class="container mt-5">
    <div class="card shadow">
      <div class="card-header bg-success text-white">
        <h3 class="mb-0">Add New Employee</h3>
      </div>
      <div class="card-body">
        <form method="POST">
          <div class="mb-3">
            <input name="name" class="form-control" placeholder="Name" required>
          </div>
          <div class="mb-3">
            <input name="email" class="form-control" placeholder="Email" required>
          </div>
          <div class="mb-3">
            <input name="job" class="form-control" placeholder="Job Title" required>
          </div>
          <div class="mb-3">
            <input name="department" class="form-control" placeholder="Department" required>
          </div>
          <div class="mb-3">
            <input name="salary" class="form-control" placeholder="Salary" type="number" required>
          </div>
          <button type="submit" class="btn btn-success">Add</button>
          <a href="/" class="btn btn-secondary">Back to Home</a>
        </form>
        <p class="mt-3 text-success fw-bold">{{ message }}</p>
      </div>
    </div>
  </div>

</body>
</html>
