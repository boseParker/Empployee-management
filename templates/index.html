<!DOCTYPE html>
<html>
<head>
  <title>Employees</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

  <div class="container mt-5">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h2>All Employees</h2>
      <a href="/add" class="btn btn-primary">➕ Add New Employee</a>
    </div>

    <form method="POST" action="/search" class="mb-4 d-flex gap-2">
      <input type="text" name="keyword" class="form-control" placeholder="Search by name">
      <button type="submit" class="btn btn-outline-success">Search</button>
    </form>

    <table class="table table-bordered table-striped shadow-sm">
      <thead class="table-dark">
        <tr>
          <th>ID</th><th>Name</th><th>Email</th><th>Job</th><th>Department</th><th>Salary</th><th>Actions</th>
        </tr>
      </thead>
      <tbody>
        {% for emp in employees %}
        <tr>
          <td>{{ emp[0] }}</td>
          <td>{{ emp[1] }}</td>
          <td>{{ emp[2] }}</td>
          <td>{{ emp[3] }}</td>
          <td>{{ emp[4] }}</td>
          <td>{{ emp[5] }}</td>
          <td>
            <a href="/update/{{ emp[0] }}" class="btn btn-sm btn-warning">Edit</a>
            <a href="/delete/{{ emp[0] }}" class="btn btn-sm btn-danger">Delete</a>
          </td>
        </tr>
        {% endfor %}
      </tbody>
    </table>
  </div>

</body>
</html>
