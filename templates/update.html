<!DOCTYPE html>
<html>
<head>
  <title>Update Employee</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

  <div class="container mt-5">
    <div class="card shadow">
      <div class="card-header bg-primary text-white">
        <h3 class="mb-0">Update Employee</h3>
      </div>
      <div class="card-body">
        <form method="POST">
          <div class="mb-3">
            <input name="name" class="form-control" value="{{ employee[1] }}" required>
          </div>
          <div class="mb-3">
            <input name="email" class="form-control" value="{{ employee[2] }}" required>
          </div>
          <div class="mb-3">
            <input name="job" class="form-control" value="{{ employee[3] }}" required>
          </div>
          <div class="mb-3">
            <input name="department" class="form-control" value="{{ employee[4] }}" required>
          </div>
          <div class="mb-3">
            <input name="salary" class="form-control" value="{{ employee[5] }}" type="number" required>
          </div>
          <button type="submit" class="btn btn-success">Update</button>
          <a href="/" class="btn btn-secondary">Back to Home</a>
        </form>
      </div>
    </div>
  </div>

</body>
</html>
